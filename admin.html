<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Customer Service</title>
<style>
body { font-family: Arial, sans-serif; }
.ticket, .newTicket { border:1px solid #ccc; padding:15px; margin:10px; border-radius:5px; }
.ticket h3, .newTicket h3 { margin:0 0 5px; }
.ticket p { margin:5px 0; }
textarea { width: 100%; height: 60px; margin-top:5px; }
button { margin-top:5px; padding:5px 10px; }
</style>
</head>
<body>

<h1>خدمة العملاء</h1>

<div class="newTicket">
  <h3>فتح تيكيت جديد</h3>
  <input type="text" id="ticketSubject" placeholder="موضوع التيكيت" />
  <textarea id="ticketMessage" placeholder="اكتب رسالتك هنا"></textarea>
  <button id="openTicketBtn">فتح التيكيت</button>
</div>

<h2>التيكيتات الحالية</h2>
<div id="ticketsContainer">جاري تحميل التيكيتات...</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC-Vi_4C3rZ-ZWwuKZgRHF40WPddR2JCvQ",
  authDomain: "elsafy-store.firebaseapp.com",
  projectId: "elsafy-store",
  storageBucket: "elsafy-store.appspot.com",
  messagingSenderId: "517856691965",
  appId: "1:517856691965:web:a3ba8b4e89ad8d8e8d2094",
  measurementId: "G-H5Y50LG1DS"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();
const db = getFirestore(app);

let currentUser = null;

// متابعة حالة تسجيل الدخول
onAuthStateChanged(auth, async (user) => {
  if(!user){
    try{
      await signInWithPopup(auth, provider);
    }catch(err){
      alert("❌ حدث خطأ أثناء تسجيل الدخول");
      return;
    }
  }
  currentUser = auth.currentUser;
  loadTickets();
});

// فتح تيكيت جديد
document.getElementById("openTicketBtn").addEventListener("click", async () => {
  const subject = document.getElementById("ticketSubject").value.trim();
  const message = document.getElementById("ticketMessage").value.trim();
  if(!subject || !message) return alert("❌ الرجاء ملء كل الحقول");

  try {
    await addDoc(collection(db, "tickets"), {
      user_id: currentUser.uid,
      user_name: currentUser.displayName,
      subject,
      message,
      status: "قيد التنفيذ",
      adminReply: "",
      timestamp: serverTimestamp()
    });
    alert("✅ تم فتح التيكيت بنجاح");
    document.getElementById("ticketSubject").value = "";
    document.getElementById("ticketMessage").value = "";
    loadTickets();
  } catch(err){
    console.error(err);
    alert("❌ حدث خطأ أثناء فتح التيكيت");
  }
});

// تحميل وعرض التيكيتات
async function loadTickets(){
  const ticketsContainer = document.getElementById("ticketsContainer");
  ticketsContainer.innerHTML = "جاري تحميل التيكيتات...";

  const snapshot = await getDocs(collection(db, "tickets"));
  ticketsContainer.innerHTML = "";

  snapshot.forEach(docSnap => {
    const ticket = docSnap.data();
    const ticketDiv = document.createElement("div");
    ticketDiv.className = "ticket";

    ticketDiv.innerHTML = `
      <h3>${ticket.subject}</h3>
      <p><strong>من المستخدم:</strong> ${ticket.user_name || ticket.user_id}</p>
      <p><strong>الرسالة:</strong> ${ticket.message}</p>
      <p><strong>الحالة:</strong> <span class="status">${ticket.status}</span></p>
      <select class="statusSelect">
        <option value="قيد التنفيذ" ${ticket.status === "قيد التنفيذ" ? "selected" : ""}>قيد التنفيذ</option>
        <option value="تم الحل" ${ticket.status === "تم الحل" ? "selected" : ""}>تم الحل</option>
      </select>
      <p><strong>رد:</strong></p>
      <textarea class="adminReply" placeholder="اكتب رد هنا">${ticket.adminReply || ""}</textarea>
      <button class="updateBtn">تحديث الحالة والرد</button>
    `;

    ticketDiv.querySelector(".updateBtn").addEventListener("click", async () => {
      const newStatus = ticketDiv.querySelector(".statusSelect").value;
      const reply = ticketDiv.querySelector(".adminReply").value;

      try {
        await updateDoc(doc(db, "tickets", docSnap.id), { status: newStatus, adminReply: reply });
        ticketDiv.querySelector(".status").innerText = newStatus;
        alert("✅ تم تحديث الحالة والرد");
      } catch(err){
        console.error(err);
        alert("❌ حدث خطأ أثناء تحديث التيكيت");
      }
    });

    ticketsContainer.appendChild(ticketDiv);
  });
}
</script>

</body>
</html>
