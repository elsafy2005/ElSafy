<div class="newTicket">
  <h3>فتح تيكيت جديد</h3>
  <input type="text" id="ticketSubject" placeholder="موضوع التيكيت" />
  <textarea id="ticketMessage" placeholder="اكتب رسالتك هنا"></textarea>
  <button id="openTicketBtn">فتح التيكيت</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, serverTimestamp, query, where } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

// إعداد Firebase
const firebaseConfig = {
  apiKey: "AIzaSyC-Vi_4C3rZ-ZWwuKZgRHF40WPddR2JCvQ",
  authDomain: "elsafy-store.firebaseapp.com",
  projectId: "elsafy-store",
  storageBucket: "elsafy-store.appspot.com",
  messagingSenderId: "517856691965",
  appId: "1:517856691965:web:a3ba8b4e89ad8d8e8d2094",
  measurementId: "G-H5Y50LG1DS"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();
const db = getFirestore(app);

let currentUser = null;

// متابعة حالة تسجيل الدخول وعرض بيانات المستخدم
const loginBtns = [document.getElementById("loginLinkDesktop"), document.getElementById("loginLinkMobile")];
const logoutBtns = [document.getElementById("logoutBtnDesktop"), document.getElementById("logoutBtnMobile")];
const userPhotos = [document.getElementById("userPhotoDesktop"), document.getElementById("userPhotoMobile")];
const userNames = [document.getElementById("userNameDesktop"), document.getElementById("userNameMobile")];

onAuthStateChanged(auth, async (user) => {
  currentUser = user || null;

  if(user){
    loginBtns.forEach(btn => btn.style.display = "none");
    logoutBtns.forEach(btn => btn.style.display = "inline-block");
    userPhotos.forEach(photo => photo.src = user.photoURL || "images/img_avatar.png");
    userNames.forEach(name => name.innerText = user.displayName);
    loadTickets();
  } else {
    loginBtns.forEach(btn => btn.style.display = "inline-block");
    logoutBtns.forEach(btn => btn.style.display = "none");
    userPhotos.forEach(photo => photo.src = "images/img_avatar.png");
    userNames.forEach(name => name.innerText = "");
  }
});

// تسجيل الدخول
loginBtns.forEach(btn => {
  btn.addEventListener("click", async (e)=>{
    e.preventDefault();
    try{
      await signInWithPopup(auth, provider);
      window.location.reload();
    }catch(err){
      console.error("Login Error:", err);
      alert("حدث خطأ أثناء تسجيل الدخول");
    }
  });
});

// تسجيل الخروج
logoutBtns.forEach(btn => {
  btn.addEventListener("click", async (e)=>{
    e.preventDefault();
    try{
      await signOut(auth);
      window.location.reload();
    }catch(err){
      console.error("Logout Error:", err);
      alert("حدث خطأ أثناء تسجيل الخروج");
    }
  });
});

// فتح تيكيت جديد
document.getElementById("openTicketBtn").addEventListener("click", async () => {
  if(!currentUser) return alert("❌ يجب تسجيل الدخول أولاً");

  const subject = document.getElementById("ticketSubject").value.trim();
  const message = document.getElementById("ticketMessage").value.trim();
  if(!subject || !message) return alert("❌ الرجاء ملء كل الحقول");

  try {
    await addDoc(collection(db, "tickets"), {
      user_id: currentUser.uid,
      user_name: currentUser.displayName,
      subject,
      message,
      status: "قيد التنفيذ",
      adminReply: "",
      timestamp: serverTimestamp()
    });
    alert("✅ تم فتح التيكيت بنجاح");
    document.getElementById("ticketSubject").value = "";
    document.getElementById("ticketMessage").value = "";
    loadTickets();
  } catch(err){
    console.error(err);
    alert("❌ حدث خطأ أثناء فتح التيكيت");
  }
});

// تحميل التيكيتات الخاصة بالمستخدم
async function loadTickets(){
  if(!currentUser) return;

  const ticketsContainer = document.getElementById("ticketsContainer");
  ticketsContainer.innerHTML = "جاري تحميل التيكيتات...";

  const ticketsQuery = query(collection(db, "tickets"), where("user_id", "==", currentUser.uid));
  const snapshot = await getDocs(ticketsQuery);
  ticketsContainer.innerHTML = "";

  if(snapshot.empty){
    ticketsContainer.innerHTML = "<p>لا توجد تيكيتات حتى الآن.</p>";
    return;
  }

  snapshot.forEach(docSnap => {
    const ticket = docSnap.data();
    const ticketDiv = document.createElement("div");
    ticketDiv.className = "ticket";

    ticketDiv.innerHTML = `
      <h3>${ticket.subject}</h3>
      <p><strong>الرسالة:</strong> ${ticket.message}</p>
      <p><strong>الحالة:</strong> <span class="status">${ticket.status}</span></p>
      <p><strong>رد الادمن:</strong></p>
      <textarea class="adminReply" readonly>${ticket.adminReply || ""}</textarea>
    `;
    ticketsContainer.appendChild(ticketDiv);
  });
}

// القوائم المنسدلة
const dropdown = document.getElementById("dropdownMenu");
function toggleDropdown() {
  dropdown.style.display = (dropdown.style.display === "flex") ? "none" : "flex";
}
window.addEventListener("click", function(e){
  if(!e.target.matches('.menu-btn')){
    dropdown.style.display = "none";
  }
});
</script>
